[project]
name = "ai-optimizer"
version = "0.1.0"
description = "Token Optimizer runtime: prompt-optimization techniques and a rule-based model router for LangChain apps"
requires-python = ">=3.10"
dependencies = []  # stdlib only; LangChain is optional (see requirements.txt), used by middleware.py

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# D100/D104: every module/package needs a docstring (module docblock rule, plan section 2)
select = ["E", "F", "W", "I", "B", "UP", "D100", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
