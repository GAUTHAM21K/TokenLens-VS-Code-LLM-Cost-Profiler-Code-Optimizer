rules:
  - id: token-optimizer-hardcoded-mongodb-uri
    patterns:
      - pattern-regex: (mongodb(\+srv)?:\/\/[^\s"']+)
    message: "Principle III violation: No MongoDB connection string or URI may be committed to source or bundled artifacts."
    languages:
      - javascript
      - typescript
      - json
      - yaml
    severity: ERROR

  - id: token-optimizer-hardcoded-secret-literal
    patterns:
      - pattern-regex: (?i)(password\s*[:=]\s*["'][^"'\s]{4,}["']|api_?key\s*[:=]\s*["'][^"'\s]{4,}["']|sk-[a-zA-Z0-9_-]{20,}|AIza[0-9A-Za-z-_]{35}|gsk_[a-zA-Z0-9_-]{20,}|xai-[a-zA-Z0-9_-]{20,}|-----BEGIN (?:[A-Z0-9_-]+ )?PRIVATE KEY-----|bearer\s+["']?[a-zA-Z0-9_\-.]{25,}["']?)
    message: "Principle I & Principle III violation: Hardcoded API keys, passwords, or provider secret tokens detected."
    languages:
      - javascript
      - typescript
      - json
      - yaml
    severity: ERROR
